<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محاكي الأيونات الموجبة والسالبة</title>
<style>
:root{--bg:#eef2f9;--card:#ffffff;--tx:#17212b;--mut:#5a6a7b;--bd:#d6dfeb;--pri:#4f46e5;--pos:#e11d48;--neg:#2563eb;--neu:#64748b;--ok:#15803d;--el:#f59e0b;--pr:#e11d48;--ne:#64748b;--stage1:#f5f3ff;--stage2:#e0e7ff;--shadow:0 6px 20px rgba(60,70,120,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131b;--card:#171f2b;--tx:#eef3f8;--mut:#a5b4c3;--bd:#2c3a4b;--pri:#818cf8;--pos:#fb7185;--neg:#60a5fa;--neu:#94a3b8;--ok:#4ade80;--el:#fbbf24;--pr:#fb7185;--ne:#94a3b8;--stage1:#1b2240;--stage2:#0f1530;--shadow:0 6px 20px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0e131b;--card:#171f2b;--tx:#eef3f8;--mut:#a5b4c3;--bd:#2c3a4b;--pri:#818cf8;--pos:#fb7185;--neg:#60a5fa;--neu:#94a3b8;--ok:#4ade80;--el:#fbbf24;--pr:#fb7185;--ne:#94a3b8;--stage1:#1b2240;--stage2:#0f1530;--shadow:0 6px 20px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7;font-size:17px}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#db2777);color:#fff;text-align:center;padding:18px 12px 22px;border-radius:0 0 28px 28px;box-shadow:var(--shadow)}
.hero h1{margin:0;font-size:1.55rem}
.hero p{margin:4px 0 0;opacity:.9;font-size:.98rem}
.wrap{max-width:980px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:1.1rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;font-style:normal;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
@media(max-width:560px){.grid{grid-template-columns:repeat(5,1fr)}}
.chip{border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:7px 0;cursor:pointer;font-size:1.15rem;font-weight:700;direction:ltr;font-family:inherit;transition:.15s}
.chip:hover{transform:translateY(-2px);border-color:var(--pri)}
.chip.on{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(79,70,229,.45)}
.main{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
@media(max-width:760px){.main{grid-template-columns:1fr}}
.stage{border-radius:18px;background:radial-gradient(circle at 50% 50%,var(--stage1),var(--stage2));padding:6px}
svg{width:100%;height:auto;display:block}
.pulse{animation:pulse .45s ease}
@keyframes pulse{0%{transform:scale(.96)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
button.act{border:0;border-radius:14px;padding:14px 8px;font-size:1.1rem;font-weight:700;cursor:pointer;color:#fff;font-family:inherit;box-shadow:0 4px 12px rgba(0,0,0,.18);transition:.15s}
button.act:active{transform:scale(.97)}
.lose{background:linear-gradient(135deg,#f43f5e,#be123c)}
.gain{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.reset{grid-column:1/-1;background:var(--neu);padding:10px!important;font-size:1rem!important}
button:disabled{opacity:.35;cursor:not-allowed}
.nota{display:flex;justify-content:center;align-items:center;direction:ltr;gap:6px;margin:2px 0 4px}
.nums{display:flex;flex-direction:column;justify-content:space-between;height:5rem;font-size:1.3rem;font-weight:700}
.sy{font-size:4.2rem;font-weight:700;line-height:1}
.sy sup{font-size:1.8rem;vertical-align:top;position:relative;top:-.2em}
.name{text-align:center;font-size:1.2rem;font-weight:700;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{border-radius:14px;padding:8px 4px;text-align:center;background:var(--bg);border:2px solid var(--bd)}
.stat b{display:block;font-size:2rem;line-height:1.2;direction:ltr}
.stat span{font-size:.92rem;color:var(--mut)}
.s-p{border-color:var(--pr)}.s-p b{color:var(--pr)}
.s-n{border-color:var(--ne)}.s-n b{color:var(--ne)}
.s-e{border-color:var(--el)}.s-e b{color:var(--el)}
.more{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.more .stat b{font-size:1.4rem}
.msg{margin-top:10px;padding:12px;border-radius:14px;border:2px solid var(--bd);background:var(--bg)}
.msg.pos{border-color:var(--pos)}.msg.neg{border-color:var(--neg)}.msg.ok{background:rgba(21,128,61,.14)}
.note{margin-top:8px;color:var(--mut);font-size:.93rem}
</style>
</head>
<body>
<div class="hero"><h1>⚛️ محاكي الأيونات الموجبة والسالبة</h1><p>افقد إلكترونًا أو اكسبه، وشاهد كيف تتحول الذرة إلى أيون</p></div>
<div class="wrap">

<div class="card"><h2><i>1</i>اختر العنصر</h2><div class="grid" id="els"></div></div>

<div class="main">
  <div class="card">
    <h2><i>2</i>جرّب بنفسك</h2>
    <div class="stage"><svg viewBox="0 0 400 400" id="svg" role="img" aria-label="نموذج الذرة"></svg></div>
    <div class="btns">
      <button class="act lose" id="lose">− فقدان إلكترون</button>
      <button class="act gain" id="gain">+ اكتساب إلكترون</button>
      <button class="act reset" id="reset">إعادة الذرة كما كانت</button>
    </div>
  </div>
  <div class="card">
    <h2><i>3</i>ماذا حدث؟</h2>
    <div class="nota"><div class="nums"><span id="ma"></span><span id="za"></span></div><div class="sy" id="sy"></div></div>
    <div class="name" id="nm"></div>
    <div class="stats">
      <div class="stat s-p"><b id="p"></b><span>بروتونات (+)</span></div>
      <div class="stat s-n"><b id="n"></b><span>نيوترونات (0)</span></div>
      <div class="stat s-e"><b id="e"></b><span>إلكترونات (−)</span></div>
    </div>
    <div class="more">
      <div class="stat"><b id="c"></b><span>الشحنة</span></div>
      <div class="stat"><b id="d"></b><span>التوزيع الإلكتروني</span></div>
    </div>
    <div class="msg" id="msg"></div>
    <div class="note">لاحظ: عدد البروتونات والنيوترونات لا يتغير أبدًا، والذي يتغير هو عدد الإلكترونات فقط.</div>
  </div>
</div>
</div>
<script>
const EL=[["H","هيدروجين",1],["He","هيليوم",4],["Li","ليثيوم",7],["Be","بيريليوم",9],["B","بورون",11],["C","كربون",12],["N","نيتروجين",14],["O","أكسجين",16],["F","فلور",19],["Ne","نيون",20],["Na","صوديوم",23],["Mg","مغنيسيوم",24],["Al","ألمنيوم",27],["Si","سيليكون",28],["P","فوسفور",31],["S","كبريت",32],["Cl","كلور",35],["Ar","أرغون",40],["K","بوتاسيوم",39],["Ca","كالسيوم",40]];
const ANION={H:"الهيدريد",N:"النيتريد",O:"الأكسيد",F:"الفلوريد",P:"الفوسفيد",S:"الكبريتيد",Cl:"الكلوريد"};
const NOBLE={2:"He",10:"Ne",18:"Ar"};
const CAP=[2,8,8,2];
let z=11,e=11;
const $=id=>document.getElementById(id);
function shells(n){const r=[];for(const c of CAP){const k=Math.min(c,n);r.push(k);n-=k}return r}
function draw(){
  const sh=shells(e),R=[72,104,136,168],sy=EL[z-1][0];
  let s=`<defs><radialGradient id="gn" cx="35%" cy="30%"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#6d28d9"/></radialGradient>
  <radialGradient id="ge" cx="35%" cy="30%"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/></radialGradient>
  <filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter></defs>`;
  sh.forEach((k,i)=>{if(k>0)s+=`<circle cx="200" cy="200" r="${R[i]}" fill="none" stroke="var(--pri)" stroke-opacity=".35" stroke-width="2.5" stroke-dasharray="4 7"/>`});
  s+=`<circle cx="200" cy="200" r="58" fill="#a78bfa" opacity=".55" filter="url(#gl)"/>`;
  s+=`<circle cx="200" cy="200" r="50" fill="url(#gn)"/>`;
  s+=`<text x="200" y="${sy.length>1?217:218}" text-anchor="middle" font-size="${sy.length>1?44:50}" font-weight="700" fill="#fff" style="font-family:Segoe UI,Arial,sans-serif">${sy}</text>`;
  sh.forEach((k,i)=>{
    let g=`<g><animateTransform attributeName="transform" type="rotate" from="0 200 200" to="${i%2?-360:360} 200 200" dur="${14+i*8}s" repeatCount="indefinite"/>`;
    for(let j=0;j<k;j++){const a=-Math.PI/2+i*0.5+j*2*Math.PI/k,x=200+R[i]*Math.cos(a),y=200+R[i]*Math.sin(a);
      g+=`<circle cx="${x}" cy="${y}" r="15" fill="#f59e0b" opacity=".45" filter="url(#gl)"/><circle cx="${x}" cy="${y}" r="11" fill="url(#ge)"/>`}
    s+=g+"</g>"});
  const sv=$("svg");sv.innerHTML=s;sv.classList.remove("pulse");void sv.getBoundingClientRect();sv.classList.add("pulse");
}
function update(){
  const [sy,nm,A]=EL[z-1],n=A-z,c=z-e,sh=shells(e).filter(x=>x>0);
  const ch=c===0?"":`<sup>${Math.abs(c)>1?Math.abs(c):""}${c>0?"+":"−"}</sup>`;
  $("sy").innerHTML=sy+ch;$("ma").textContent=A;$("za").textContent=z;
  $("nm").textContent=c===0?"ذرة "+nm:(c>0?"أيون "+nm+" الموجب":(ANION[sy]?"أيون "+ANION[sy]+" السالب":"أيون سالب"));
  $("p").textContent=z;$("n").textContent=n;$("e").textContent=e;
  $("c").textContent=c===0?"0":(c>0?"+"+c:"−"+Math.abs(c));
  $("d").textContent=sh.length?sh.join(" , "):"—";
  let m,k="msg",ok=false;
  if(c===0){m="ذرة متعادلة: عدد البروتونات (+) يساوي عدد الإلكترونات (−)، لذلك الشحنة صفر."}
  else if(c>0){k+=" pos";m=`أيون موجب: فقدت الذرة ${c} إلكترون، فأصبح عدد البروتونات أكبر من عدد الإلكترونات.`}
  else{k+=" neg";m=`أيون سالب: اكتسبت الذرة ${Math.abs(c)} إلكترون، فأصبح عدد الإلكترونات أكبر من عدد البروتونات.`}
  if(NOBLE[e]&&c!==0){ok=true;m+=` توزيعه الإلكتروني يشبه توزيع ${NOBLE[e]}، فهو مستقر.`}
  else if(c!==0){m+=" توزيعه لا يشبه أي غاز نبيل، فهو غير مستقر."}
  else if(NOBLE[e]){ok=true;m+=" وهي غاز نبيل مستقر."}
  $("msg").textContent=m;$("msg").className=k+(ok?" ok":"");
  $("lose").disabled=e<=0;$("gain").disabled=e>=20;
  document.querySelectorAll(".chip").forEach((b,i)=>b.classList.toggle("on",i+1===z));
  draw();
}
const g=$("els");
EL.forEach(([sy,nm],i)=>{const b=document.createElement("button");b.className="chip";b.textContent=sy;b.title=nm;b.onclick=()=>{z=i+1;e=z;update()};g.appendChild(b)});
$("lose").onclick=()=>{if(e>0){e--;update()}};
$("gain").onclick=()=>{if(e<20){e++;update()}};
$("reset").onclick=()=>{e=z;update()};
update();
</script>
</body>
</html>
